# freeDiameter configuration of the Open5GS HSS for go-diam's capture job.

Identity = "hss.test";
Realm = "test";

# Plain TCP on 127.0.0.1:3868 (host network); no SCTP, no TLS port.
ListenOn = "127.0.0.1";
Port = 3868;
SecPort = 0;
No_SCTP;
NoRelay;

TLS_Cred = "/etc/open5gs/tls/hss.crt", "/etc/open5gs/tls/hss.key";
TLS_CA = "/etc/open5gs/tls/hss.crt";

# Message dumps go to the container log, next to the frames the test saves.
LoadExtension = "/open5gs/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x8888";
LoadExtension = "/open5gs/lib/freeDiameter/dict_rfc5777.fdx";
LoadExtension = "/open5gs/lib/freeDiameter/dict_mip6i.fdx";
LoadExtension = "/open5gs/lib/freeDiameter/dict_nasreq.fdx";
LoadExtension = "/open5gs/lib/freeDiameter/dict_nas_mipv6.fdx";
LoadExtension = "/open5gs/lib/freeDiameter/dict_dcca.fdx";
LoadExtension = "/open5gs/lib/freeDiameter/dict_dcca_3gpp.fdx";

# The test's identities: an MME (TestPeerS6a) and an S-CSCF (TestPeerCx).
# They connect in; the HSS's own attempts go to a closed port and fail.
ConnectPeer = "mme.test" { ConnectTo = "127.0.0.1"; Port = 3869; No_TLS; };
ConnectPeer = "scscf.test" { ConnectTo = "127.0.0.1"; Port = 3869; No_TLS; };
