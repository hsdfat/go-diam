# Minimal freeDiameter peer for go-diam's capture job.

Identity = "peer.test";
Realm = "test";

# Plain TCP on 3868; no SCTP, no TLS port.
Port = 3868;
SecPort = 0;
No_SCTP;

TLS_Cred = "/etc/freeDiameter/cert.pem", "/etc/freeDiameter/key.pem";
TLS_CA = "/etc/freeDiameter/cert.pem";
TLS_DH_File = "/etc/freeDiameter/dh.pem";

# Accept peers that are not configured here, by name (see acl_wl.conf).
# This is the only extension: the base dictionary is built in.
LoadExtension = "acl_wl.fdx" : "/etc/freeDiameter/acl_wl.conf";
