message SmsfNon3gppAddress {
  option (diam.extensible) = true;
  optional bytes smsf_non3gpp_number = 1 [(diam.avp) = "SMSF_NON_3GPP_NUMBER"];
  optional string smsf_non3gpp_name = 2 [(diam.avp) = "SMSF_NON_3GPP_NAME"];
  optional string smsf_non3gpp_realm = 3 [(diam.avp) = "SMSF_NON_3GPP_REALM"];
  optional SmsfNon3gppSbiSupportIndicator smsf_non3gpp_sbi_support_indicator = 4 [(diam.avp) = "SMSF_NON_3GPP_SBI_SUPPORT_INDICATOR"];
}

// SM-Delivery-Failure-Cause (§6.3.3.5; in table 5.3.3.1/2, in no S6c command)
//
// SM-Delivery-Failure-Cause ::= <AVP header: 3303 10415>
