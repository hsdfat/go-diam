// S6t: SCEF - HSS (Diameter application 16777345).
//
// Source: 3GPP TS 29.336 V18.2.0 (Release 18), published as
// ETSI TS 129 336 V18.2.0 (2024-05); the latest Release 18 version.
//   Commands:      §8.2.2 table 8.2.2-1, §8.2.3-8.2.8 (CIR/CIA, RIR/RIA,
//                  NIR/NIA)
//   Application:   §8.1.8 (16777345, vendor 3GPP)
//   AVP tables:    §8.4.1 table 8.4.1-1, all rows, and table 8.4.1-2 (the
//                  re-used AVPs and their S6t M-bit)
//   Grouped AVPs:  §8.4.2-8.4.85, every grammar reachable from the commands
//   Result codes:  §8.3.3 (5510-5514, 5516, and 5451 from TS 29.272)
//
// AVPs that TS 29.336 re-uses (table 8.4.1-2) are in this file's
// dictionaries too, as in S6a, Cx and Sh. Where table 8.4.1-2 gives an
// M-bit ("Must not set"), that value is the one here; where its M-bit
// column is empty, the defining specification's flag rule applies:
//   TS 29.336 §6.4.2, 6.4.11 table 6.4.1/1   User-Identifier,
//                                      External-Identifier (M, V); the S6t
//                                      form of User-Identifier is §8.4.36
//   TS 29.329 V18.0.0 table 6.3.1      MSISDN (M, V)
//   TS 29.229 V18.1.0 §6.3.29-6.3.31   Supported-Features, Feature-List-ID,
//                                      Feature-List (M "May")
//   TS 29.272 V18.7.0 table 7.3.1/1    Visited-PLMN-Id, EPS-, MME- and
//                                      SGSN-Location-Information and their
//                                      members, Terminal-Information and its
//                                      members, IMSI-Group-Id and its
//                                      members, PDN-Type, Non-IP-*, CSG-Id,
//                                      Subscribed-Periodic-RAU-TAU-Timer,
//                                      DL-Buffering-Suggested-Packet-Count,
//                                      eDRX-Cycle-Length and its value
//   TS 32.299 V18.0.0 §7.2             Charged-Party, User-CSG-Information,
//                                      CSG-Access-Mode,
//                                      CSG-Membership-Indication,
//                                      Served-Party-IP-Address (V, M)
//   TS 29.212 V18.2.0 §5.3.31          RAT-Type (V), inside
//                                      eDRX-Cycle-Length
//   TS 29.217 V18.0.0 table 5.3.1      eNodeB-ID (V, M), Extended-eNodeB-ID
//   TS 29.338 V18.2.0 §5.3.3.22        Maximum-UE-Availability-Time (V)
//   TS 29.128 V18.0.0 §6.4.32-6.4.35   Idle-Status-Indication,
//                                      Idle-Status-Timestamp, Active-Time,
//                                      Reachability-Cause
//   TS 29.154 V18.0.0 §5.3.10          Number-of-UEs (code 4209)
//   RFC 5777 §4.2.5-4.2.7              Time-Of-Day-Start, Time-Of-Day-End,
//                                      Day-Of-Week-Mask
//   RFC 5778 §6.2                      Service-Selection (M)
//   RFC 7683 §7.1-7.7                  OC-Supported-Features, OC-OLR and
//                                      their AVPs
//   RFC 7944 §9.1                      DRMP
//   RFC 8583 §7.1-7.4                  Load and its AVPs
// Base protocol AVPs come from ietf/rfc6733/base.proto. Grouped AVPs
// defined elsewhere carry their grammar from that specification, except
// EPS-, MME- and SGSN-Location-Information and User-Identifier, for which
// TS 29.336 gives its own S6t grammar (§8.4.21, 8.4.34-8.4.36).
//
// Release compatibility (design §5.3a): S6t first appears in Release 13.
// Every AVP that is required here is also required in TS 29.336 V13.2.0
// (ETSI TS 129 336 V13.2.0, the earliest Release 13 version ETSI publishes),
// or sits in a grouped AVP or command that Release 13 does not have (NIR,
// NIA). Release 13 differs in ways that stay compatible:
//   - Reference-ID-Validity-Time (3148) is called Validity-Time there; same
//     code, type and flags.
//   - Release 13 MME- and SGSN-Location-Information also list
//     Geographical-Information and Geodetic-Information. Their M-bit is
//     clear (TS 29.272), so a Release 13 peer's copies stay in Unknown
//     without an error.
//   - Two AVPs with the M-bit set were dropped after Release 13: the
//     *[ Failed-AVP ] of RIR and the [ Service-Result ] that
//     Monitoring-Event-Config-Status had before Service-Report replaced
//     it. A Release 13 message carrying them would otherwise fail with
//     5001, so both are kept at their Release 13 position as optional
//     ([ Failed-AVP ] before Proxy-Info), as Cx RTR keeps Destination-Host
//     (design §13).
//   - Release 13 answers carry *[ Failed-AVP ]; [ Failed-AVP ] from the
//     current release is used, as in S6a.
//
// Rulings where the specification text needs reading:
//   - RIR: the header in §8.2.5 reads "8388719, PXY" and the prose says
//     the R-bit is cleared, the same as RIA. RIR is the request of the pair
//     (table 8.2.2-1, "is sent from the HSS to the SCEF"), so it is
//     generated with the R-bit set.
//   - Vendor-Specific-Application-Id: §8.2.2 NOTE says it "is included as
//     an optional AVP in all Command Code Format specifications" and that a
//     receiver ignores it, but no S6t ABNF lists it. It has the M-bit set,
//     so leaving it out would turn "ignore" into 5001. Every command carries
//     it as [ Vendor-Specific-Application-Id ] after DRMP, where S6a has it.
//   - Include-Identifiers: §8.4.85 heads its ABNF "AVP header: xxxx";
//     table 8.4.1-1 gives 3189, which is used.
//   - Supported-Features M-bit: table 8.4.1-2 gives none; §8.1.9 applies
//     TS 29.229 §7.2, whose §7.2.1 sets it in requests and clears it in
//     answers. The dictionary has it clear and every request sets
//     (diam.m) = true, as in Cx and Sh.
//   - Table spellings "Maximum Latency", "Maximum Response Time",
//     "Periodic-time" and the clause title "Stationary indication" are the
//     AVPs Maximum-Latency, Maximum-Response-Time, Periodic-Time and
//     Stationary-Indication of the ABNFs. AdditionalIdentifiers keeps its
//     spelling (ADDITIONALIDENTIFIERS); its fields use (diam.avp).
//   - Unsigned32 AVPs with named values (Monitoring-Type, Accuracy,
//     Node-Type, ...) are uint32 fields: the type is the table's, the values
//     are listed next to the dictionary entry.
//   - "At least one of SCEF-Reference-ID or SCEF-Reference-ID-for-Deletion
//     shall be present" (§8.4.2, 8.4.25, 8.4.80), the one-identity rule of
//     User-Identifier (§8.4.36) and the PDN-Type / Non-IP rules of
//     PDN-Connectivity-Status-Report (§8.4.77) are procedure rules without a
//     Result-Code of their own; Validate checks the grammar only.
//   - CIR and CIA list [ Suggested-Network-Configuration ] after
//     *[ Route-Record ]; the order is kept.
//
// Each command and grouped message carries its ABNF as a comment.
syntax = "proto3";

package godiam.s6t;

import "diam/options.proto";
import "ietf/rfc6733/base.proto";

option go_package = "github.com/hsdfat/go-diam/s6t";

