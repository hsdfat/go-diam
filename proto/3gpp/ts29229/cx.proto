  SIP_ITEM_NUMBER = 613 [(diam.def) = {vendor: 10415, m: true, type: UNSIGNED32}];
  SERVER_ASSIGNMENT_TYPE = 614 [(diam.def) = {vendor: 10415, m: true, type: ENUMERATED}];
  DEREGISTRATION_REASON = 615 [(diam.def) = {vendor: 10415, m: true, type: GROUPED}];
  REASON_CODE = 616 [(diam.def) = {vendor: 10415, m: true, type: ENUMERATED}];
  REASON_INFO = 617 [(diam.def) = {vendor: 10415, m: true, type: UTF8_STRING}];
  CHARGING_INFORMATION = 618 [(diam.def) = {vendor: 10415, m: true, type: GROUPED}];
  PRIMARY_EVENT_CHARGING_FUNCTION_NAME = 619 [(diam.def) = {vendor: 10415, m: true, type: DIAMETER_URI}];
