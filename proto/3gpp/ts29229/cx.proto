  SIP_AUTHENTICATE = 609 [(diam.def) = {vendor: 10415, m: true, type: OCTET_STRING}];
  SIP_AUTHORIZATION = 610 [(diam.def) = {vendor: 10415, m: true, type: OCTET_STRING}];
