// Cx/Dx: I-CSCF/S-CSCF - HSS/SLF (Diameter application 16777216).
//
// Source: 3GPP TS 29.229 V18.1.0 (Release 18), published as
// ETSI TS 129 229 V18.1.0 (2024-10); the latest Release 18 version.
//   Commands:      §6.1 table 6.1.1, §6.1.1-6.1.12 (UAR/UAA, SAR/SAA,
//                  LIR/LIA, MAR/MAA, RTR/RTA, PPR/PPA)
//   AVP table:     §6.3.0 table 6.3.0.1, all rows, and Line-Identifier
//                  (§6.3.42, not in the table)
//   Grouped AVPs:  §6.3.4, 6.3.13, 6.3.16, 6.3.19, 6.3.29, 6.3.32, 6.3.33,
//                  6.3.36, 6.3.46, 6.3.49, 6.3.50, 6.3.52, 6.3.57, 6.3.64,
//                  6.3.70, 6.3.74
//   Enumerations:  the clause of each Enumerated AVP in §6.3
// Procedures and information elements: 3GPP TS 29.228 V18.0.0
// (ETSI TS 129 228 V18.0.0, 2024-05), §6.
//
// AVPs that TS 29.229 re-uses are in this file's dictionaries too, with the
// flag rules table 6.3.0.1 gives them (it lists the IETF ones it re-uses):
//   RFC 4740 / RFC 4590                Digest-Realm, Digest-Algorithm,
//                                      Digest-QoP, Digest-HA1 (codes and
//                                      flags from table 6.3.0.1)
//   RFC 7155 §4.4.10.5.1, .5.5, .5.6   Framed-IP-Address, Framed-Interface-Id,
//                                      Framed-IPv6-Prefix (TS 29.229 cites
//                                      RFC 4005, which RFC 7155 obsoletes)
//   RFC 7683 §7.1-7.7                  OC-Supported-Features, OC-OLR and
//                                      their AVPs
//   RFC 7944 §9.1                      DRMP
//   RFC 8583 §7.1-7.4                  Load and its AVPs
// Base protocol AVPs come from ietf/rfc6733/base.proto.
//
// Release compatibility (design §5.3a): every AVP that is required here is
// also required in TS 29.229 V8.15.0 (Release 8), and the Release 8
// grouped AVPs have the same required members. One exception goes the other
// way, see Destination-Host in RTR below. Release 8 answers carry
// *[ Failed-AVP ]; Release 14 (CR 0286) made it [ Failed-AVP ], which is used
// here, as in S6a.
//
// Rulings where the specification text disagrees with itself:
//   - RTR Destination-Host: the V18.1.0 RTR grammar (§6.1.9) has no
//     Destination-Host, but TS 29.228 V18.0.0 table 6.1.3.1 maps "Routing
//     Information" to Destination-Host with category M, and TS 29.229
//     V8.15.0 has { Destination-Host } between Origin-Realm and
//     Destination-Realm. It is kept there as [ Destination-Host ], so that
//     an RTR from either reading passes Validate; a sender should set it.
//   - RTR "RTR-Flags ]" is read as [ RTR-Flags ]; RTA lists < Session-Id >
//     twice, read as once.
//   - Supported-Features M-bit: table 6.3.0.1 says "May"; §7.2.1 says it is
//     set in requests and clear in answers. The dictionary has it clear and
//     every request sets (diam.m) = true.
//   - Line-Identifier (§6.3.42): vendor ETSI (13019), code 500,
//     OctetString, no flag rule in TS 29.229; sent with the M-bit clear, as
//     S6a does for AVPs without a flag rule.
//   - Load (table 6.3.0.1 "NOTE 6" for the code) is RFC 8583's AVP 650.
//   - Wildcarded-IMPU (§6.3.43) is not in table 6.3.0.1 and has no code in
//     TS 29.229; it is used on Sh only and is left to the Sh schema.
//   - Supported-Applications (§6.3.32) is used only by the error answer of
//     §7.3.1, not by the Cx commands; its grouped type is here so that an
//     application can decode it from Unknown.
//   - Spellings kept as written: Priviledged-Sender-Indication,
//     PRIORITY-0..4 (Session-Priority), REMOVE_S-CSCF (Reason-Code).
//
// Each command and grouped message carries its ABNF as a comment.
syntax = "proto3";

package godiam.cx;

import "diam/options.proto";
import "ietf/rfc6733/base.proto";

option go_package = "github.com/hsdfat/go-diam/cx";

