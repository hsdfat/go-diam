  ORIGINATING_REQUEST = 633 [(diam.def) = {vendor: 10415, m: true, type: ENUMERATED}];
  WILDCARDED_PUBLIC_IDENTITY = 634 [(diam.def) = {vendor: 10415, type: UTF8_STRING}];
  SIP_DIGEST_AUTHENTICATE = 635 [(diam.def) = {vendor: 10415, type: GROUPED}];
  UAR_FLAGS = 637 [(diam.def) = {vendor: 10415, type: UNSIGNED32}];
  LOOSE_ROUTE_INDICATION = 638 [(diam.def) = {vendor: 10415, type: ENUMERATED}];
