// EtsiAvp holds the ETSI AVP (vendor 13019) that TS 29.229 re-uses.
enum EtsiAvp {
  option (diam.dictionary) = true;
  ETSI_AVP_UNSPECIFIED = 0;
  // §6.3.42: vendor 13019, code 500, OctetString; no flag rule given, M left clear
  LINE_IDENTIFIER = 500 [(diam.def) = {vendor: 13019, type: OCTET_STRING}];
}

// IetfAvp holds the re-used IETF AVPs (no Vendor-Id). They are a separate
// dictionary because an enum value number is the AVP code, and codes 621,
// 622, 623, 625, 626, 649, 650, 651 and 652 are both an IETF and a 3GPP AVP.
enum IetfAvp {
  option (diam.dictionary) = true;
  IETF_AVP_UNSPECIFIED = 0;
  // RFC 7155 §4.4.10.5.1 and its flag table
  FRAMED_IP_ADDRESS = 8 [(diam.def) = {m: true, type: OCTET_STRING}];
  // RFC 7155 §4.4.10.5.5 and its flag table
  FRAMED_INTERFACE_ID = 96 [(diam.def) = {m: true, type: UNSIGNED64}];
  // RFC 7155 §4.4.10.5.6 and its flag table
  FRAMED_IPV6_PREFIX = 97 [(diam.def) = {m: true, type: OCTET_STRING}];
  // RFC 4590 / RFC 4740; table 6.3.0.1: Must M, Must not V
  DIGEST_REALM = 104 [(diam.def) = {m: true, type: UTF8_STRING}];
  // RFC 4590 / RFC 4740; table 6.3.0.1: Must M, Must not V
  DIGEST_QOP = 110 [(diam.def) = {m: true, type: UTF8_STRING}];
  // RFC 4590 / RFC 4740; table 6.3.0.1: Must M, Must not V
  DIGEST_ALGORITHM = 111 [(diam.def) = {m: true, type: UTF8_STRING}];
  // RFC 4590 / RFC 4740; table 6.3.0.1: Must M, Must not V
  DIGEST_HA1 = 121 [(diam.def) = {m: true, type: UTF8_STRING}];
  // RFC 7944 §9.1; table 6.3.0.1: Must not M, V
  DRMP = 301 [(diam.def) = {type: ENUMERATED}];
  // RFC 7683 §7.1; table 6.3.0.1: Must not M, V
  OC_SUPPORTED_FEATURES = 621 [(diam.def) = {type: GROUPED}];
  // RFC 7683 §7.2
  OC_FEATURE_VECTOR = 622 [(diam.def) = {type: UNSIGNED64}];
  // RFC 7683 §7.3; table 6.3.0.1: Must not M, V
  OC_OLR = 623 [(diam.def) = {type: GROUPED}];
  // RFC 7683 §7.4
  OC_SEQUENCE_NUMBER = 624 [(diam.def) = {type: UNSIGNED64}];
  // RFC 7683 §7.5
  OC_VALIDITY_DURATION = 625 [(diam.def) = {type: UNSIGNED32}];
  // RFC 7683 §7.6
  OC_REPORT_TYPE = 626 [(diam.def) = {type: ENUMERATED}];
  // RFC 7683 §7.7
  OC_REDUCTION_PERCENTAGE = 627 [(diam.def) = {type: UNSIGNED32}];
  // RFC 8583 §7.4
  SOURCEID = 649 [(diam.def) = {type: DIAMETER_IDENTITY}];
  // RFC 8583 §7.1; table 6.3.0.1: Must not M, V
  LOAD = 650 [(diam.def) = {type: GROUPED}];
  // RFC 8583 §7.2
  LOAD_TYPE = 651 [(diam.def) = {type: ENUMERATED}];
  // RFC 8583 §7.3
  LOAD_VALUE = 652 [(diam.def) = {type: UNSIGNED64}];
}

// Server-Assignment-Type (§6.3.15). Values 12-14 are used on SWx only.
enum ServerAssignmentType {
  SERVER_ASSIGNMENT_TYPE_NO_ASSIGNMENT = 0;
  SERVER_ASSIGNMENT_TYPE_REGISTRATION = 1;
  SERVER_ASSIGNMENT_TYPE_RE_REGISTRATION = 2;
  SERVER_ASSIGNMENT_TYPE_UNREGISTERED_USER = 3;
  SERVER_ASSIGNMENT_TYPE_TIMEOUT_DEREGISTRATION = 4;
  SERVER_ASSIGNMENT_TYPE_USER_DEREGISTRATION = 5;
  SERVER_ASSIGNMENT_TYPE_TIMEOUT_DEREGISTRATION_STORE_SERVER_NAME = 6;
  SERVER_ASSIGNMENT_TYPE_USER_DEREGISTRATION_STORE_SERVER_NAME = 7;
  SERVER_ASSIGNMENT_TYPE_ADMINISTRATIVE_DEREGISTRATION = 8;
  SERVER_ASSIGNMENT_TYPE_AUTHENTICATION_FAILURE = 9;
  SERVER_ASSIGNMENT_TYPE_AUTHENTICATION_TIMEOUT = 10;
  SERVER_ASSIGNMENT_TYPE_DEREGISTRATION_TOO_MUCH_DATA = 11;
  SERVER_ASSIGNMENT_TYPE_AAA_USER_DATA_REQUEST = 12;
  SERVER_ASSIGNMENT_TYPE_PGW_UPDATE = 13;
  SERVER_ASSIGNMENT_TYPE_RESTORATION = 14;
}

// Reason-Code (§6.3.17). REMOVE_S-CSCF is spelt REMOVE_S_CSCF.
enum ReasonCode {
  REASON_CODE_PERMANENT_TERMINATION = 0;
  REASON_CODE_NEW_SERVER_ASSIGNED = 1;
  REASON_CODE_SERVER_CHANGE = 2;
  REASON_CODE_REMOVE_S_CSCF = 3;
}

// User-Authorization-Type (§6.3.24).
enum UserAuthorizationType {
  USER_AUTHORIZATION_TYPE_REGISTRATION = 0;
  USER_AUTHORIZATION_TYPE_DE_REGISTRATION = 1;
  USER_AUTHORIZATION_TYPE_REGISTRATION_AND_CAPABILITIES = 2;
}

// User-Data-Already-Available (§6.3.26).
enum UserDataAlreadyAvailable {
  USER_DATA_ALREADY_AVAILABLE_USER_DATA_NOT_AVAILABLE = 0;
  USER_DATA_ALREADY_AVAILABLE_USER_DATA_ALREADY_AVAILABLE = 1;
}

// Originating-Request (§6.3.34).
enum OriginatingRequest {
  ORIGINATING_REQUEST_ORIGINATING = 0;
}

// Loose-Route-Indication (§6.3.45).
enum LooseRouteIndication {
  LOOSE_ROUTE_INDICATION_LOOSE_ROUTE_NOT_REQUIRED = 0;
  LOOSE_ROUTE_INDICATION_LOOSE_ROUTE_REQUIRED = 1;
}

// Multiple-Registration-Indication (§6.3.51).
enum MultipleRegistrationIndication {
  MULTIPLE_REGISTRATION_INDICATION_NOT_MULTIPLE_REGISTRATION = 0;
  MULTIPLE_REGISTRATION_INDICATION_MULTIPLE_REGISTRATION = 1;
}

// Session-Priority (§6.3.56). PRIORITY-0 is the highest priority.
enum SessionPriority {
  SESSION_PRIORITY_PRIORITY_0 = 0;
  SESSION_PRIORITY_PRIORITY_1 = 1;
  SESSION_PRIORITY_PRIORITY_2 = 2;
  SESSION_PRIORITY_PRIORITY_3 = 3;
  SESSION_PRIORITY_PRIORITY_4 = 4;
}

// Priviledged-Sender-Indication (§6.3.58), spelt as in the specification.
enum PriviledgedSenderIndication {
  PRIVILEDGED_SENDER_INDICATION_NOT_PRIVILEDGED_SENDER = 0;
  PRIVILEDGED_SENDER_INDICATION_PRIVILEDGED_SENDER = 1;
}

// DRMP (RFC 7944 §9.1).
enum Drmp {
  DRMP_PRIORITY_0 = 0;
  DRMP_PRIORITY_1 = 1;
  DRMP_PRIORITY_2 = 2;
  DRMP_PRIORITY_3 = 3;
  DRMP_PRIORITY_4 = 4;
  DRMP_PRIORITY_5 = 5;
  DRMP_PRIORITY_6 = 6;
  DRMP_PRIORITY_7 = 7;
  DRMP_PRIORITY_8 = 8;
  DRMP_PRIORITY_9 = 9;
  DRMP_PRIORITY_10 = 10;
  DRMP_PRIORITY_11 = 11;
  DRMP_PRIORITY_12 = 12;
  DRMP_PRIORITY_13 = 13;
  DRMP_PRIORITY_14 = 14;
  DRMP_PRIORITY_15 = 15;
}

// OC-Report-Type (RFC 7683 §7.6).
enum OcReportType {
  OC_REPORT_TYPE_HOST_REPORT = 0;
  OC_REPORT_TYPE_REALM_REPORT = 1;
}

// Load-Type (RFC 8583 §7.2).
enum LoadType {
  LOAD_TYPE_HOST = 0;
  LOAD_TYPE_PEER = 1;
}

// OC-Supported-Features (RFC 7683 §7.1)
//
// OC-Supported-Features ::= < AVP Header: 621 >
//   [ OC-Feature-Vector ]
//   *[ AVP ]
message OcSupportedFeatures {
  option (diam.extensible) = true;
  optional uint64 oc_feature_vector = 1;
}

// OC-OLR (RFC 7683 §7.3)
//
// OC-OLR ::= < AVP Header: 623 >
//   < OC-Sequence-Number >
//   < OC-Report-Type >
//   [ OC-Reduction-Percentage ]
//   [ OC-Validity-Duration ]
//   *[ AVP ]
message OcOlr {
  option (diam.extensible) = true;
  uint64 oc_sequence_number = 1 [(diam.fixed) = true];
  OcReportType oc_report_type = 2 [(diam.fixed) = true];
  optional uint32 oc_reduction_percentage = 3;
  optional uint32 oc_validity_duration = 4;
}

// Load (RFC 8583 §7.1)
//
// Load ::= < AVP Header: 650 >
//   [ Load-Type ]
//   [ Load-Value ]
//   [ SourceID ]
//   *[ AVP ]
message Load {
  option (diam.extensible) = true;
  optional LoadType load_type = 1;
  optional uint64 load_value = 2;
  optional string sourceid = 3;
}

// Server-Capabilities (§6.3.4)
//
// Server-Capabilities ::= <AVP header: 603 10415>
//   *[Mandatory-Capability]
//   *[Optional-Capability]
//   *[Server-Name]
//   *[AVP]
message ServerCapabilities {
  option (diam.extensible) = true;
  repeated uint32 mandatory_capability = 1;
  repeated uint32 optional_capability = 2;
  repeated string server_name = 3;
}

// SIP-Auth-Data-Item (§6.3.13)
//
// SIP-Auth-Data-Item :: = < AVP Header : 612 10415 >
//   [ SIP-Item-Number ]
//   [ SIP-Authentication-Scheme ]
//   [ SIP-Authenticate ]
//   [ SIP-Authorization ]
//   [ SIP-Authentication-Context ]
//   [ Confidentiality-Key ]
//   [ Integrity-Key ]
//   [ SIP-Digest-Authenticate ]
//   [ Framed-IP-Address ]
//   [ Framed-IPv6-Prefix ]
//   [ Framed-Interface-Id ]
//   * [ Line-Identifier ]
//   * [AVP]
message SipAuthDataItem {
  option (diam.extensible) = true;
  optional uint32 sip_item_number = 1;
  optional string sip_authentication_scheme = 2;
  optional bytes sip_authenticate = 3;
  optional bytes sip_authorization = 4;
  optional bytes sip_authentication_context = 5;
  optional bytes confidentiality_key = 6;
  optional bytes integrity_key = 7;
  optional SipDigestAuthenticate sip_digest_authenticate = 8;
  optional bytes framed_ip_address = 9;
  optional bytes framed_ipv6_prefix = 10;
  optional uint64 framed_interface_id = 11;
  repeated bytes line_identifier = 12;
}

// Deregistration-Reason (§6.3.16)
//
// Deregistration-Reason :: = < AVP Header : 615 10415 >
//   { Reason-Code }
//   [ Reason-Info ]
//   * [AVP]
message DeregistrationReason {
  option (diam.extensible) = true;
  ReasonCode reason_code = 1;
  optional string reason_info = 2;
}

// Charging-Information (§6.3.19)
//
// Charging-Information :: = < AVP Header : 618 10415 >
//   [ Primary-Event-Charging-Function-Name ]
//   [ Secondary-Event-Charging-Function-Name ]
//   [ Primary-Charging-Collection-Function-Name ]
//   [ Secondary-Charging-Collection-Function-Name ]
//   *[ AVP]
message ChargingInformation {
  option (diam.extensible) = true;
  optional string primary_event_charging_function_name = 1;
  optional string secondary_event_charging_function_name = 2;
  optional string primary_charging_collection_function_name = 3;
  optional string secondary_charging_collection_function_name = 4;
}

// Supported-Features (§6.3.29)
//
// Supported-Features ::= < AVP header: 628 10415 >
//   { Vendor-Id }
//   { Feature-List-ID }
//   { Feature-List }
//   *[AVP]
message SupportedFeatures {
  option (diam.extensible) = true;
  uint32 vendor_id = 1;
  uint32 feature_list_id = 2;
  uint32 feature_list = 3;
}

// Supported-Applications (§6.3.32)
//
// Supported-Applications ::= < AVP header: 631 10415 >
//   *[ Auth-Application-Id ]
//   *[ Acct-Application-Id ]
//   *[ Vendor-Specific-Application-Id ]
//   *[ AVP ]
message SupportedApplications {
  option (diam.extensible) = true;
  repeated uint32 auth_application_id = 1;
  repeated uint32 acct_application_id = 2;
  repeated godiam.base.VendorSpecificApplicationId vendor_specific_application_id = 3;
}

// Associated-Identities (§6.3.33)
//
// Associated-Identities ::= < AVP header: 632, 10415 >
//   *[ User-Name ]
//   *[ AVP ]
message AssociatedIdentities {
  option (diam.extensible) = true;
  repeated string user_name = 1;
}

// SIP-Digest-Authenticate (§6.3.36)
//
// SIP-Digest-Authenticate ::= < AVP Header: 635 10415>
//   { Digest-Realm }
