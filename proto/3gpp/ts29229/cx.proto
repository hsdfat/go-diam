  SERVER_NAME = 602 [(diam.def) = {vendor: 10415, m: true, type: UTF8_STRING}];
  SERVER_CAPABILITIES = 603 [(diam.def) = {vendor: 10415, m: true, type: GROUPED}];
  MANDATORY_CAPABILITY = 604 [(diam.def) = {vendor: 10415, m: true, type: UNSIGNED32}];
  OPTIONAL_CAPABILITY = 605 [(diam.def) = {vendor: 10415, m: true, type: UNSIGNED32}];
  USER_DATA = 606 [(diam.def) = {vendor: 10415, m: true, type: OCTET_STRING}];
