// S6a/S6d: MME/SGSN - HSS (Diameter application 16777251).
//
// Source: 3GPP TS 29.272 V18.7.0 (Release 18), published as
// ETSI TS 129 272 V18.7.0 (2026-10).
//   Commands:      §7.2.2 table 7.2.2/1, §7.2.3-7.2.18 (ULR/ULA, AIR/AIA,
//                  CLR/CLA, IDR/IDA, DSR/DSA, PUR/PUA, RSR/RSA, NOR/NOA),
//                  the S6a/S6d (16777251) form of each
//   AVP table:     §7.3.1 table 7.3.1/1, all rows (including the S7a/S7d and
//                  S13/S13' AVPs, so those applications can import this file)
//   Grouped AVPs:  §7.3.2-7.3.252, every grammar reachable from the commands
//   Enumerations:  the clause of each Enumerated AVP in §7.3
//
// AVPs that TS 29.272 re-uses (table 7.3.1/2) are in this dictionary too,
// transcribed from the specification named next to each entry. Where table
// 7.3.1/2 gives an M-bit ("Must set" / "Must not set"), that value is the
// one here: its NOTE 1 says it overrides the defining specification. This is
// why they are not imported from shared files: the same AVP carries a
// different M-bit in S6a than in its own application. Grouped AVPs defined
// elsewhere carry their grammar from that specification:
//   TS 29.229 V18.1.0 §6.3.29          Supported-Features
//   TS 29.212 V18.2.0 §5.3.32          Allocation-Retention-Priority (also
//                                      repeated in TS 29.272 §7.3.40)
//   TS 32.299 V18.0.0 §7.2.240A        User-CSG-Information
//   TS 29.336 V18.2.0 §8.4.15, 8.4.24, 8.4.30, 8.4.37, 8.4.47, 8.4.74,
//                     8.4.76, 8.4.77   Location-Information-Configuration,
//                                      Monitoring-Event-Config-Status,
//                                      Scheduled-Communication-Time,
//                                      Service-Result, Service-Report,
//                                      MTC-Provider-Info,
//                                      PDN-Connectivity-Status-Configuration
//                                      and -Report
//   TS 29.128 V18.0.0 §6.4.32          Idle-Status-Indication
//   RFC 4004 §7.11                     MIP-Home-Agent-Host
//   RFC 7683 §7.1, §7.3                OC-Supported-Features, OC-OLR
//   RFC 8583 §7.1                      Load
// TS 29.272 gives its own S6a grammar for AESE-Communication-Pattern,
// Communication-Pattern-Set, Monitoring-Event-Configuration,
// Monitoring-Event-Report, UE-Reachability-Configuration, Supported-Services,
// ProSe-Subscription-Data and MIP6-Agent-Info (§7.3.180, 7.3.193-7.3.197,
// 7.3.199, 7.3.45); those are used, not the defining specifications'.
//
// Release compatibility (design §5.3a): every AVP that is required here is
// also required in TS 29.272 V8.14.0 (Release 8), or sits in a grouped AVP
// that Release 8 does not have. No exception is needed.
//
// Rulings where the specification text disagrees with itself:
//   - Area-Scope: §7.3.138 heads its ABNF "AVP header: 1623"; table 7.3.1/1
//     gives 1624, and 1623 is Job-Type. 1624 is used.
//   - Additional-Context-ID: table 7.3.1/1 name; the ABNF of
//     APN-Configuration-Profile writes Additional-Context-Identifier.
//   - MME-Location-Information: table 7.3.1/1 writes "MME-Location
//     Information".
//   - ABNF spellings "IDR- Flags", "Collection-Period- RRM-LTE",
//     "Re-synchronization-Info" and "Monitoring Event Report" are read as
//     IDR-Flags, Collection-Period-RRM-LTE, Re-Synchronization-Info and
//     Monitoring-Event-Report.
//   - Enumerated AVPs whose values TS 29.272 delegates to TS 32.422
//     (Trace-Depth, Job-Type, Report-Interval, Report-Amount,
//     Logging-Interval, Logging-Duration, Measurement-Period-*,
//     Collection-Period-*) are plain int32 fields.
//   - AVPs with no flag rule in their defining RFC and none in table
//     7.3.1/2 (MIP6-Home-Link-Prefix, Time-Of-Day-Start/-End,
//     Day-Of-Week-Mask) are sent with the M-bit clear: a receiver that does
//     not know them then ignores them instead of rejecting the message.
//   - Dictionary names are the AVP name in upper case with "-" and " " as
//     "_" (LCS-PrivacyException -> LCS_PRIVACYEXCEPTION), and TGPP / FIVE_QI
//     for the names that start with a digit (3GPP2-MEID,
//     3GPP-Charging-Characteristics, 5QI).
//
// Not here: the S13/S13' commands ECR/ECA (§7.2.19-7.2.20) and the S7a/S7d
// commands UVR/UVA, CVR/CVA and the 16777308 forms of IDR/DSR/RSR
// (§7.2.9-7.2.24); their AVPs are in the dictionary.
//
// Each command and grouped message carries its ABNF as a comment.
syntax = "proto3";

